# The plugin's checks on GitHub, started by hand only (Actions → Checks → Run workflow): the founder's rule for every repository is CI on
# workflow_dispatch, the full gate runs on the Mac before a push. Round zero: phpcs and the unit and structure tests on PHP 8.1 (the
# promised minimum) and the newest PHP. wp-env (the integration layer) and Playwright stay local for now.
name: Checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: phpcs and PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Versions agree
        run: bin/check-version.sh
      - name: Lint (PHP compatibility and WordPress's security rules)
        run: composer lint
      - name: Unit and structure tests
        run: composer test
